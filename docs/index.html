<title>H-Programs</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif;
  background: linear-gradient(135deg, #2c3e50 0%, #7c1d1d 100%);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #222;
}
.lock {
  background: #fff;
  padding: 40px 32px;
  border-radius: 20px;
  box-shadow: 0 12px 48px rgba(0,0,0,0.25);
  width: 320px;
  text-align: center;
}
.lock .icon { font-size: 48px; margin-bottom: 12px; }
.lock h1 { margin: 0 0 8px; font-size: 22px; color: #2c3e50; }
.lock .sub { font-size: 13px; color: #888; margin-bottom: 24px; }
.lock input {
  width: 100%; padding: 12px 14px; font-size: 16px;
  border: 2px solid #e0e0e0; border-radius: 10px;
  outline: none; text-align: center; letter-spacing: 4px;
}
.lock input:focus { border-color: #7c1d1d; }
.lock button {
  width: 100%; padding: 12px; margin-top: 12px;
  background: linear-gradient(135deg, #2c3e50, #7c1d1d);
  color: #fff; border: 0; border-radius: 10px;
  font-size: 15px; font-weight: 600; cursor: pointer;
}
.lock button:disabled { opacity: 0.5; cursor: not-allowed; }
.lock .err { color: #c0392b; font-size: 13px; margin-top: 10px; min-height: 18px; }
</style>
</head>

async function decrypt(b64, pw) {
  try {
    const enc = new TextEncoder();
    const pwHash = await crypto.subtle.digest('SHA-256', enc.encode(pw));
    const key = await crypto.subtle.importKey('raw', pwHash, {name:'AES-CBC'}, false, ['decrypt']);
    const combined = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
    const iv = combined.slice(0, 16);
    const ct = combined.slice(16);
    const pt = await crypto.subtle.decrypt({name:'AES-CBC', iv}, key, ct);
    return new TextDecoder().decode(pt);
  } catch(e) { return null; }
}

async function unlock(pw) {
  const html = await decrypt(ENC, pw);
  if (!html || html.indexOf('<') < 0) return false;
  document.open();
  document.write(html);
  document.close();
  sessionStorage.setItem('hpPagePw', pw);
  return true;
}

window.addEventListener('DOMContentLoaded', async () => {
  const saved = sessionStorage.getItem('hpPagePw');
  if (saved) {
    const ok = await unlock(saved);
    if (ok) return;
    sessionStorage.removeItem('hpPagePw');
  }
  const btn = document.getElementById('btn');
  const pwIn = document.getElementById('pw');
  const err = document.getElementById('err');
  btn.onclick = async () => {
    btn.disabled = true; err.textContent = '';
    const ok = await unlock(pwIn.value);
    if (!ok) {
      err.textContent = '비밀번호가 틀립니다';
      btn.disabled = false;
      pwIn.select();
    }
  };
  pwIn.addEventListener('keypress', e => { if (e.key === 'Enter') btn.click(); });
});
</script>
